<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="spTitle spDesc">
  <title id="spTitle">Seed paper made from recycled paper</title>
  <desc id="spDesc">A sheet of recycled paper with a seedling sprouting through it, surrounded by scattered seeds, showing the reuse of clean paper pulp.</desc>

  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6e6"/><stop offset="100%" stop-color="#d7ebca"/>
    </linearGradient>
    <linearGradient id="spSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf1"/><stop offset="100%" stop-color="#f1e6d3"/>
    </linearGradient>
  </defs>

  <circle cx="280" cy="230" r="196" fill="url(#spBg)"/>
  <circle cx="280" cy="230" r="196" fill="none" stroke="#c9e3b4" stroke-width="2" stroke-dasharray="8 12"/>

  <!-- shadow -->
  <ellipse cx="280" cy="366" rx="152" ry="17" fill="#2c6122" opacity=".13"/>

  <!-- sheet -->
  <path d="M138 118 h248 a10 10 0 0 1 10 10 v222 a10 10 0 0 1 -10 10 h-248 a10 10 0 0 1 -10 -10 v-222 a10 10 0 0 1 10 -10 Z"
        fill="url(#spSheet)" stroke="#c9a886" stroke-width="2.4"/>
  <!-- torn right edge -->
  <path d="M396 128 l6 10 l-6 10 l6 10 l-6 10 l6 10 l-6 10 l6 10 l-6 10 l6 10 l-6 10 l6 10 l-6 10 l6 10 l-6 10"
        fill="none" stroke="#c9a886" stroke-width="2.2" stroke-linejoin="round" opacity=".85"/>
  <!-- paper flecks (recycled pulp) -->
  <g fill="#c9a886" opacity=".55">
    <circle cx="168" cy="176" r="3"/><circle cx="196" cy="150" r="2"/><circle cx="230" cy="188" r="2.6"/>
    <circle cx="160" cy="236" r="2.2"/><circle cx="330" cy="300" r="3"/><circle cx="352" cy="332" r="2.4"/>
    <circle cx="202" cy="312" r="2"/><circle cx="286" cy="150" r="2.2"/><circle cx="150" cy="290" r="2.8"/>
  </g>
  <!-- fibre lines -->
  <g stroke="#c9a886" stroke-width="1.4" opacity=".45" stroke-linecap="round">
    <path d="M160 210 h48"/><path d="M300 200 h44"/>
    <path d="M170 258 h34"/>
  </g>

  <!-- sprout through the sheet -->
  <g>
    <path d="M280 250 C280 206 268 178 240 158" stroke="#3b802c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M280 250 C282 202 300 172 326 152" stroke="#4b9732" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M280 252 C280 218 280 190 281 164" stroke="#6bb04f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="234" cy="150" rx="30" ry="15" fill="#6bb04f" transform="rotate(-34 234 150)"/>
    <ellipse cx="332" cy="144" rx="30" ry="15" fill="#4b9732" transform="rotate(30 332 144)"/>
    <ellipse cx="281" cy="156" rx="20" ry="11" fill="#8cc06d"/>
    <path d="M212 160 C228 168 248 166 258 154" fill="none" stroke="#3b802c" stroke-width="2.4" opacity=".55"/>
    <path d="M308 154 C322 166 344 166 356 154" fill="none" stroke="#2c6122" stroke-width="2.4" opacity=".5"/>
  </g>

  <!-- roots below the sprout inside paper -->
  <g stroke="#8b5e3c" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M280 252 C280 292 268 314 250 336"/>
    <path d="M280 252 C282 296 294 318 312 340"/>
    <path d="M280 278 C266 288 258 302 254 316"/>
  </g>

  <!-- loose seeds -->
  <g fill="#8b5e3c" opacity=".85">
    <ellipse cx="452" cy="212" rx="8" ry="5.5" transform="rotate(24 452 212)"/>
    <ellipse cx="470" cy="248" rx="8" ry="5.5" transform="rotate(-16 470 248)"/>
    <ellipse cx="96"  cy="252" rx="8" ry="5.5" transform="rotate(-28 96 252)"/>
    <ellipse cx="112" cy="290" rx="8" ry="5.5" transform="rotate(18 112 290)"/>
  </g>
  <!-- germination dots -->
  <g fill="#c9a886" opacity=".8">
    <circle cx="438" cy="252" r="4"/><circle cx="486" cy="228" r="4"/>
    <circle cx="80"  cy="222" r="4"/><circle cx="126" cy="238" r="4"/>
  </g>
</svg>

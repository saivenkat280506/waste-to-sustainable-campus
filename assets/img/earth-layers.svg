<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" role="img" aria-labelledby="elTitle elDesc">
  <title id="elTitle">How litter reaches soil and water</title>
  <desc id="elDesc">A cross-section of a campus showing litter on the surface, rainwater carrying waste into soil and a stream, where it harms soil quality, plants and aquatic life.</desc>

  <defs>
    <linearGradient id="skyE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcdff2"/><stop offset="100%" stop-color="#e9f5fb"/>
    </linearGradient>
    <linearGradient id="waterE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec6e4"/><stop offset="100%" stop-color="#4f8fbd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="660" height="520" rx="24" fill="url(#skyE)"/>

  <!-- surface line -->
  <rect x="0" y="196" width="660" height="26" fill="#7ba95c"/>
  <rect x="0" y="222" width="660" height="86" fill="#8a5f3c"/>
  <rect x="0" y="308" width="660" height="96" fill="#a97d52"/>
  <rect x="0" y="404" width="660" height="86" fill="#7a736a"/>
  <!-- water table / stream -->
  <path d="M404 404 L660 404 L660 490 L404 490 Z" fill="url(#waterE)"/>
  <path d="M404 404 q40 -22 86 0 t86 0 t84 0" fill="none" stroke="#cfe8f6" stroke-width="4" opacity=".9"/>
  <!-- bedrock -->
  <path d="M0 470 q60 -18 120 0 t120 0 t120 0 t120 0 t120 0" fill="none" stroke="#55504a" stroke-width="4" opacity=".55"/>

  <!-- litter on the surface -->
  <g>
    <rect x="86" y="172" width="40" height="26" rx="3" fill="#fbfaf4" stroke="#c9a886" stroke-width="2" transform="rotate(-9 106 185)"/>
    <path d="M162 196 h34 l-3 -26 h-28 Z" fill="#cfd8dd" stroke="#8d9aa3" stroke-width="2"/>
    <rect x="290" y="178" width="30" height="18" rx="2" fill="#a97a55" transform="rotate(8 305 187)"/>
    <circle cx="348" cy="184" r="13" fill="#5a9c45" opacity=".9"/>
  </g>

  <!-- tree -->
  <g transform="translate(178,20)">
    <path d="M60 176 L60 84" stroke="#6b4a2f" stroke-width="13" stroke-linecap="round"/>
    <circle cx="54" cy="58" r="42" fill="#3f7d32"/>
    <circle cx="90" cy="38" r="33" fill="#2f6b2c"/>
    <circle cx="60" cy="22" r="28" fill="#5a9c45"/>
    <g fill="none" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round">
      <path d="M60 176 C58 140 46 124 26 112"/>
      <path d="M60 176 C62 142 78 126 100 116"/>
      <path d="M60 150 C52 136 46 130 36 126"/>
      <path d="M60 150 C70 138 78 132 90 128"/>
    </g>
  </g>

  <!-- roots -->
  <g stroke="#5c412a" stroke-width="2.8" fill="none" stroke-linecap="round" opacity=".85">
    <path d="M238 196 C238 240 224 268 206 292"/>
    <path d="M238 196 C240 246 258 272 280 296"/>
    <path d="M238 232 C222 248 212 268 210 288"/>
  </g>

  <!-- rain -->
  <g stroke="#7fb6d6" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M360 44 l-8 26"/><path d="M404 70 l-8 26"/><path d="M452 38 l-8 26"/>
    <path d="M492 82 l-8 26"/>
  </g>

  <!-- runoff path into the stream -->
  <path d="M348 196 C380 214 410 240 430 300 C446 350 458 386 468 416"
        fill="none" stroke="#6b4a2f" stroke-width="4.5" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M468 416 l-14 -6 l6 15 Z" fill="#6b4a2f"/>

  <!-- aquatic life (in open water) -->
  <g fill="#3d6f8c">
    <path d="M436 454 c12 -10 26 -10 38 0 c-12 10 -26 10 -38 0 Z" opacity=".9"/>
    <path d="M436 454 l-12 -8 v16 Z" opacity=".9"/>
    <circle cx="496" cy="472" r="4" fill="#2b536b" opacity=".75"/>
  </g>

  <!-- labels & aligned badge symbols -->
  <g font-family="Karla, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fdf7ee">
    <!-- LITTER ON CAMPUS -->
    <rect x="270" y="132" width="188" height="28" rx="14" fill="#4f4941" opacity=".9"/>
    <text x="364" y="151" text-anchor="middle">LITTER ON CAMPUS</text>

    <!-- TOPSOIL -->
    <rect x="16" y="236" width="168" height="30" rx="15" fill="#6b4a2f" opacity=".92"/>
    <circle cx="32" cy="251" r="9" fill="#f7ecd8"/>
    <path d="M28 251 l3 3 l5 -6" fill="none" stroke="#3f7d32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="256" text-anchor="middle">TOPSOIL</text>

    <!-- SUBSOIL -->
    <rect x="16" y="322" width="168" height="30" rx="15" fill="#6b4a2f" opacity=".92"/>
    <circle cx="32" cy="337" r="9" fill="#f7ecd8"/>
    <path d="M28 337 l3 3 l5 -6" fill="none" stroke="#3f7d32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="342" text-anchor="middle">SUBSOIL</text>

    <!-- BEDROCK -->
    <rect x="16" y="418" width="168" height="30" rx="15" fill="#4f4941" opacity=".92"/>
    <circle cx="32" cy="433" r="9" fill="#f7ecd8"/>
    <path d="M28 433 l3 3 l5 -6" fill="none" stroke="#3f7d32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="438" text-anchor="middle">BEDROCK</text>

    <!-- WATER -->
    <rect x="494" y="418" width="150" height="30" rx="15" fill="#2e6f9e" opacity=".92"/>
    <circle cx="510" cy="433" r="9" fill="#e3f2fd"/>
    <path d="M506 433 l3 3 l5 -6" fill="none" stroke="#1976d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="580" y="438" text-anchor="middle">WATER</text>
  </g>
</svg>

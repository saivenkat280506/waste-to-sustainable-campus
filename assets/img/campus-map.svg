<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Top-down plan of the college campus</title>
  <desc id="mapDesc">An illustrated campus plan showing the academic block, library, canteen, administration wing, lawns, a garden bed, a fountain, a sports area and three bin stations along the main walkway.</desc>

  <defs>
    <linearGradient id="mLawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe4b8"/><stop offset="100%" stop-color="#b7d69a"/>
    </linearGradient>
    <linearGradient id="mPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e7d2"/><stop offset="100%" stop-color="#e3d2b4"/>
    </linearGradient>
    <linearGradient id="mRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2673f"/><stop offset="100%" stop-color="#9a4528"/>
    </linearGradient>
    <linearGradient id="mRoof2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d07a4c"/><stop offset="100%" stop-color="#ae502d"/>
    </linearGradient>
    <linearGradient id="mWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6dcee"/><stop offset="100%" stop-color="#7bb4d2"/>
    </linearGradient>
    <filter id="mSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#33413a" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="900" height="580" fill="url(#mLawn)"/>

  <!-- organic lawn patches -->
  <path d="M0 0 h900 v120 q-150 60 -320 10 q-180 -52 -330 20 q-130 62 -250 20 Z" fill="#c2dcaa"/>
  <path d="M0 580 h900 v-110 q-160 50 -320 5 q-170 -48 -330 18 q-130 54 -250 22 Z" fill="#c2dcaa"/>

  <!-- main walkway cross -->
  <path d="M0 300 h900 v66 h-900 Z" fill="url(#mPath)"/>
  <path d="M430 0 h64 v580 h-64 Z" fill="url(#mPath)"/>
  <g stroke="#ddcdb2" stroke-width="1.6" opacity=".9">
    <path d="M0 333 h900"/><path d="M462 0 v580"/>
  </g>
  <!-- paving joints -->
  <g stroke="#e3d6bf" stroke-width="1.4" opacity=".8">
    <path d="M120 300 v66M240 300 v66M360 300 v66M600 300 v66M720 300 v66M820 300 v66"/>
    <path d="M430 120 h64M430 240 h64M430 420 h64M430 510 h64"/>
  </g>

  <!-- ACADEMIC BLOCK (top centre) -->
  <g filter="url(#mSoft)">
    <rect x="352" y="58" width="196" height="168" rx="7" fill="#fbf8ef" stroke="#cdbb9c" stroke-width="2.5"/>
    <rect x="352" y="58" width="196" height="44" rx="7" fill="url(#mRoof)"/>
    <rect x="352" y="92" width="196" height="10" fill="#8a3a20"/>
    <g fill="#8fbfd8">
      <rect x="368" y="120" width="24" height="30" rx="3"/><rect x="404" y="120" width="24" height="30" rx="3"/>
      <rect x="440" y="120" width="24" height="30" rx="3"/><rect x="476" y="120" width="24" height="30" rx="3"/>
      <rect x="512" y="120" width="20" height="30" rx="3"/>
      <rect x="368" y="166" width="24" height="30" rx="3"/><rect x="404" y="166" width="24" height="30" rx="3"/>
      <rect x="440" y="166" width="24" height="30" rx="3"/><rect x="476" y="166" width="24" height="30" rx="3"/>
      <rect x="512" y="166" width="20" height="30" rx="3"/>
    </g>
    <rect x="418" y="206" width="64" height="20" rx="4" fill="#b98a63"/>
  </g>

  <!-- LIBRARY (left) -->
  <g filter="url(#mSoft)">
    <rect x="72" y="88" width="200" height="130" rx="7" fill="#fbf8ef" stroke="#cdbb9c" stroke-width="2.5"/>
    <rect x="72" y="88" width="200" height="34" rx="7" fill="url(#mRoof2)"/>
    <g fill="#8fbfd8">
      <rect x="90" y="138" width="22" height="26" rx="3"/><rect x="122" y="138" width="22" height="26" rx="3"/>
      <rect x="154" y="138" width="22" height="26" rx="3"/><rect x="186" y="138" width="22" height="26" rx="3"/>
      <rect x="218" y="138" width="22" height="26" rx="3"/>
      <rect x="90" y="178" width="22" height="24" rx="3"/><rect x="122" y="178" width="22" height="24" rx="3"/>
      <rect x="154" y="178" width="22" height="24" rx="3"/><rect x="186" y="178" width="22" height="24" rx="3"/>
      <rect x="218" y="178" width="22" height="24" rx="3"/>
    </g>
  </g>

  <!-- CANTEEN (right) -->
  <g filter="url(#mSoft)">
    <rect x="640" y="78" width="196" height="132" rx="7" fill="#fbf8ef" stroke="#cdbb9c" stroke-width="2.5"/>
    <rect x="640" y="78" width="196" height="34" rx="7" fill="url(#mRoof)"/>
    <g fill="#7daec8" opacity=".9">
      <rect x="658" y="130" width="30" height="26" rx="3"/><rect x="698" y="130" width="30" height="26" rx="3"/>
      <rect x="738" y="130" width="30" height="26" rx="3"/><rect x="778" y="130" width="30" height="26" rx="3"/>
    </g>
    <g fill="#8fbfd8">
      <rect x="658" y="168" width="30" height="26" rx="3"/><rect x="698" y="168" width="30" height="26" rx="3"/>
      <rect x="738" y="168" width="30" height="26" rx="3"/><rect x="778" y="168" width="30" height="26" rx="3"/>
    </g>
  </g>

  <!-- ADMIN WING (left bottom) -->
  <g filter="url(#mSoft)">
    <rect x="78" y="398" width="176" height="112" rx="7" fill="#fbf8ef" stroke="#cdbb9c" stroke-width="2.5"/>
    <rect x="78" y="398" width="176" height="30" rx="7" fill="url(#mRoof2)"/>
    <g fill="#8fbfd8">
      <rect x="94" y="444" width="24" height="26" rx="3"/><rect x="128" y="444" width="24" height="26" rx="3"/>
      <rect x="162" y="444" width="24" height="26" rx="3"/><rect x="196" y="444" width="24" height="26" rx="3"/>
    </g>
  </g>

  <!-- GARDEN BED (right bottom) -->
  <g>
    <rect x="648" y="404" width="196" height="104" rx="12" fill="#9b6a45" stroke="#7a4c2f" stroke-width="2.5"/>
    <g fill="#3f7d32">
      <circle cx="676" cy="436" r="13"/><circle cx="712" cy="430" r="15"/><circle cx="750" cy="438" r="12"/>
      <circle cx="790" cy="430" r="14"/><circle cx="822" cy="440" r="11"/>
      <circle cx="684" cy="476" r="14"/><circle cx="722" cy="482" r="12"/><circle cx="760" cy="474" r="14"/>
      <circle cx="800" cy="480" r="12"/><circle cx="826" cy="470" r="10"/>
    </g>
    <g fill="#6aa84f" opacity=".9">
      <circle cx="690" cy="452" r="7"/><circle cx="736" cy="452" r="6"/><circle cx="782" cy="456" r="7"/>
      <circle cx="812" cy="446" r="5"/>
    </g>
  </g>

  <!-- FOUNTAIN / WATER (centre right) -->
  <g>
    <ellipse cx="600" cy="180" rx="62" ry="40" fill="url(#mWater)" stroke="#6ba8c9" stroke-width="2"/>
    <ellipse cx="600" cy="180" rx="32" ry="20" fill="#cfeaf7" opacity=".85"/>
    <circle cx="600" cy="180" r="9" fill="#7bb4d2"/>
    <g stroke="#9ccbdd" stroke-width="2" fill="none" opacity=".8">
      <path d="M554 172 q46 -16 92 0"/><path d="M556 190 q44 14 88 0"/>
    </g>
  </g>

  <!-- SPORTS AREA (centre left) -->
  <g>
    <rect x="252" y="400" width="142" height="104" rx="12" fill="#d8b98c" stroke="#b58a5c" stroke-width="2.5"/>
    <circle cx="323" cy="452" r="30" fill="none" stroke="#f6efe0" stroke-width="3"/>
    <path d="M293 452 h60" stroke="#f6efe0" stroke-width="3"/>
    <path d="M323 422 v60" stroke="#f6efe0" stroke-width="3"/>
  </g>

  <!-- TREES -->
  <g>
    <g fill="#2f6b2c"><circle cx="46" cy="392" r="22"/><circle cx="120" cy="356" r="19"/><circle cx="828" cy="358" r="23"/></g>
    <g fill="#3f7d32"><circle cx="30" cy="424" r="18"/><circle cx="96" cy="330" r="16"/><circle cx="856" cy="392" r="19"/></g>
    <g fill="#5a9c45"><circle cx="52" cy="366" r="13"/><circle cx="112" cy="384" r="12"/><circle cx="844" cy="332" r="13"/></g>
    <g fill="#2f6b2c"><circle cx="300" cy="248" r="17"/><circle cx="600" cy="286" r="15"/></g>
    <g fill="#4f9440"><circle cx="286" cy="278" r="14"/><circle cx="614" cy="256" r="13"/></g>
  </g>

  <!-- BIN STATION (along the main walkway, centre) -->
  <g id="binStation" filter="url(#mSoft)">
    <rect x="368" y="276" width="164" height="52" rx="10" fill="#fbfaf4" stroke="#cdbb9c" stroke-width="2"/>
    <g>
      <path d="M382 296 h34 l-3 24 h-28 Z" fill="#3f8f45"/>
      <rect x="378" y="290" width="42" height="7" rx="3" fill="#256b2f"/>
      <path d="M437 296 h34 l-3 24 h-28 Z" fill="#3f8fc4"/>
      <rect x="433" y="290" width="42" height="7" rx="3" fill="#246a9b"/>
      <path d="M492 296 h34 l-3 24 h-28 Z" fill="#f0a04a"/>
      <rect x="488" y="290" width="42" height="7" rx="3" fill="#a85414"/>
    </g>
  </g>

  <!-- PLANT POT / reuse corner (centre bottom) -->
  <g id="potCorner">
    <path d="M536 470 h58 l-7 42 h-44 Z" fill="#cbd8de"/>
    <rect x="530" y="462" width="70" height="12" rx="4" fill="#b0c1ca"/>
    <path d="M565 462 C565 442 556 430 540 424" stroke="#3f7d32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M565 462 C566 438 578 426 596 420" stroke="#4f9440" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="537" cy="421" rx="12" ry="6" fill="#6aa84f" transform="rotate(-32 537 421)"/>
    <ellipse cx="599" cy="418" rx="12" ry="6" fill="#4f9440" transform="rotate(28 599 418)"/>
  </g>

  <!-- gate + gatehouse (bottom centre) -->
  <g>
    <rect x="378" y="516" width="144" height="10" rx="5" fill="#5c3a21"/>
    <rect x="378" y="546" width="144" height="10" rx="5" fill="#5c3a21"/>
    <rect x="404" y="516" width="92" height="40" fill="#fbf8ef" stroke="#cdbb9c" stroke-width="2"/>
    <rect x="404" y="516" width="92" height="12" fill="#ae502d"/>
  </g>

  <!-- small signs -->
  <g fill="#8b5e3c">
    <rect x="546" y="322" width="6" height="40" rx="3"/>
    <rect x="528" y="322" width="42" height="22" rx="5"/>
    <rect x="286" y="330" width="6" height="34" rx="3"/>
    <rect x="270" y="330" width="38" height="20" rx="5"/>
  </g>
  <g fill="#fbfaf4" opacity=".9">
    <rect x="534" y="329" width="30" height="3" rx="1.5"/>
    <rect x="276" y="337" width="26" height="3" rx="1.5"/>
  </g>

  <!-- border -->
  <rect x="1.5" y="1.5" width="897" height="577" rx="20" fill="none" stroke="#ffffff" stroke-width="3" opacity=".55"/>
</svg>

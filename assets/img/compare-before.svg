<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cmpBeforeTitle cmpBeforeDesc">
  <title id="cmpBeforeTitle">The HITAM campus as it is today</title>
  <desc id="cmpBeforeDesc">A flat illustration of the campus walkway with litter scattered on the path and grass, a single unlabelled overflowing bin, plastic bottles, cups and wrappers left around.</desc>

  <defs>
    <linearGradient id="bSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfdde3"/>
      <stop offset="58%" stop-color="#e2edf1"/>
      <stop offset="100%" stop-color="#f0f6f8"/>
    </linearGradient>
    <linearGradient id="bRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a4a30"/>
      <stop offset="100%" stop-color="#b05a3a"/>
    </linearGradient>
    <linearGradient id="bWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c7d8c"/>
      <stop offset="100%" stop-color="#6f94a3"/>
    </linearGradient>
    <g id="bArch">
      <path d="M0 30 V13 A11 11 0 0 1 22 13 V30 Z" fill="url(#bWindow)"/>
      <path d="M11 4 V30" stroke="#d9d3c2" stroke-width="1.6" opacity=".3"/>
    </g>
    <g id="bTrash">
      <path d="M0 0 C9 -11 24 -11 31 0 C24 11 9 11 0 0 Z M0 0 C9 -4 22 -4 31 0" fill="none" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ===================================================== sky -->
  <rect width="1600" height="900" fill="url(#bSky)"/>
  <circle cx="1296" cy="118" r="56" fill="#efe3c8"/>
  <circle cx="1296" cy="118" r="74" fill="none" stroke="#ddd0b4" stroke-width="2" stroke-dasharray="6 10"/>
  <g fill="none" stroke="#a8a292" stroke-width="3" stroke-linecap="round" opacity=".45">
    <path d="M240 150 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M300 192 q8 -7 16 0 q8 -7 16 0"/>
  </g>

  <!-- ===================================================== landscape -->
  <path d="M0 516 Q220 450 470 510 Q760 578 1060 496 Q1330 428 1600 484 L1600 900 L0 900 Z" fill="#b3c99a"/>
  <path d="M0 570 Q300 524 620 562 Q1000 608 1600 522 L1600 900 L0 900 Z" fill="#9fba86"/>
  <path d="M0 620 Q280 574 620 606 Q1020 648 1600 578 L1600 900 L0 900 Z" fill="#b8cda0"/>

  <!-- path (cracked, dull) -->
  <path d="M596 900 Q650 720 716 606 L884 606 Q846 716 1004 900 Z" fill="#ded3bc"/>
  <path d="M596 900 Q650 720 716 606" fill="none" stroke="#c2b397" stroke-width="3"/>
  <path d="M1004 900 Q846 716 884 606" fill="none" stroke="#c2b397" stroke-width="3"/>
  <g fill="none" stroke="#b6a689" stroke-width="2.4" stroke-linecap="round" opacity=".85">
    <path d="M700 838 l34 20 l-20 34"/>
    <path d="M880 742 l-30 26 l22 26"/>
    <path d="M792 668 l-26 18"/>
  </g>

  <!-- ===================================================== building -->
  <rect x="470" y="392" width="104" height="208" fill="#faf7ee" stroke="#c6b493" stroke-width="2"/>
  <rect x="458" y="376" width="128" height="17" rx="5" fill="url(#bRoof)"/>
  <use href="#bArch" x="498" y="424"/>
  <use href="#bArch" x="498" y="480"/>
  <use href="#bArch" x="534" y="424"/>
  <use href="#bArch" x="534" y="480"/>

  <rect x="1026" y="392" width="104" height="208" fill="#faf7ee" stroke="#c6b493" stroke-width="2"/>
  <rect x="1014" y="376" width="128" height="17" rx="5" fill="url(#bRoof)"/>
  <use href="#bArch" x="1054" y="424"/>
  <use href="#bArch" x="1054" y="480"/>
  <use href="#bArch" x="1090" y="424"/>
  <use href="#bArch" x="1090" y="480"/>

  <rect x="620" y="300" width="360" height="300" fill="#faf7ee" stroke="#c6b493" stroke-width="2"/>
  <path d="M596 302 L800 196 L1004 302 Z" fill="url(#bRoof)"/>
  <path d="M596 302 L800 196 L1004 302" fill="none" stroke="#7a3520" stroke-width="2" opacity=".45"/>
  <path d="M620 300 L800 202 L980 300" fill="none" stroke="#e3cfae" stroke-width="2.5" opacity=".4"/>

  <rect x="756" y="156" width="88" height="68" fill="#faf7ee" stroke="#c6b493" stroke-width="2"/>
  <path d="M742 158 L800 102 L858 158 Z" fill="#8a3d25"/>
  <path d="M800 102 L800 66" stroke="#5a2d1a" stroke-width="3" stroke-linecap="round"/>
  <path d="M801 68 C822 72 830 80 830 88 C818 86 808 82 801 76 Z" fill="#3f7d32" opacity=".85"/>
  <use href="#bArch" x="772" y="170"/>
  <use href="#bArch" x="806" y="170"/>

  <use href="#bArch" x="648" y="344"/>
  <use href="#bArch" x="700" y="344"/>
  <use href="#bArch" x="878" y="344"/>
  <use href="#bArch" x="930" y="344"/>
  <use href="#bArch" x="648" y="404"/>
  <use href="#bArch" x="700" y="404"/>
  <use href="#bArch" x="878" y="404"/>
  <use href="#bArch" x="930" y="404"/>

  <rect x="676" y="258" width="248" height="30" rx="6" fill="#3a532f"/>
  <g fill="#e7f2dc" opacity=".85">
    <rect x="690" y="270" width="74" height="6" rx="3"/>
    <rect x="776" y="270" width="42" height="6" rx="3"/>
    <rect x="830" y="270" width="80" height="6" rx="3"/>
  </g>

  <path d="M772 600 V520 a28 28 0 0 1 56 0 V600 Z" fill="#5e3d23"/>
  <path d="M781 600 V522 a19 19 0 0 1 38 0 V600" fill="none" stroke="#8d6746" stroke-width="2" opacity=".6"/>
  <rect x="756" y="600" width="88" height="10" rx="2" fill="#d8c5a8"/>
  <rect x="744" y="610" width="112" height="10" rx="2" fill="#c9b494"/>
  <rect x="748" y="344" width="10" height="256" fill="#e8ddc7" stroke="#c6b493" stroke-width="1.5"/>
  <rect x="842" y="344" width="10" height="256" fill="#e8ddc7" stroke="#c6b493" stroke-width="1.5"/>


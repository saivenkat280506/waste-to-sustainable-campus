  <path d="M1316 598 L1316 452" stroke="#6b4a2f" stroke-width="13" stroke-linecap="round"/>
  <circle cx="1308" cy="402" r="42" fill="#2f6b2c"/>
  <circle cx="1344" cy="376" r="34" fill="#3f7d32"/>
  <circle cx="1318" cy="358" r="30" fill="#5a9c45"/>

  <ellipse cx="404" cy="618" rx="46" ry="20" fill="#6aa84f" opacity=".85"/>
  <ellipse cx="1156" cy="622" rx="52" ry="22" fill="#6aa84f" opacity=".85"/>
  <ellipse cx="562" cy="632" rx="34" ry="15" fill="#8cc46a" opacity=".8"/>

  <!-- ===================================================== LITTER -->
  <!-- overflowing, unlabelled bin -->
  <g transform="translate(1086,664)">
    <ellipse cx="62" cy="146" rx="72" ry="14" fill="#8fae79" opacity=".55"/>
    <path d="M0 34 h124 l-13 112 h-98 Z" fill="#77745f"/>
    <path d="M0 34 h124 l-13 112 h-98 Z" fill="none" stroke="#5d5a49" stroke-width="2.4"/>
    <path d="M34 46 l-4 96 M92 46 l5 96" stroke="#65624f" stroke-width="2" opacity=".7"/>
    <rect x="-11" y="20" width="146" height="17" rx="7" fill="#565340"/>
    <g stroke="#6f6b56" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M22 18 q8 -26 22 -30"/>
      <path d="M58 16 q-4 -30 14 -38"/>
      <path d="M96 18 q10 -24 4 -36"/>
    </g>
    <path d="M10 60 q30 -12 52 2 q24 14 52 -2" fill="none" stroke="#a8a48a" stroke-width="3" opacity=".8"/>
  </g>

  <!-- plastic bottle on the path -->
  <g transform="translate(548,812) rotate(22)">
    <rect x="0" y="0" width="74" height="30" rx="14" fill="#cfe3ec" stroke="#8fa9b5" stroke-width="2"/>
    <rect x="-16" y="7" width="20" height="16" rx="5" fill="#b8d0da" stroke="#8fa9b5" stroke-width="2"/>
    <rect x="74" y="10" width="20" height="10" rx="5" fill="#b8d0da" stroke="#8fa9b5" stroke-width="2"/>
    <rect x="22" y="6" width="30" height="18" rx="4" fill="#e8e4d6" opacity=".85"/>
  </g>

  <!-- crushed cup -->
  <g transform="translate(438,742) rotate(-68)">
    <path d="M0 0 h44 l-7 48 h-30 Z" fill="#d8cfba" stroke="#b6a98c" stroke-width="2"/>
    <ellipse cx="22" cy="0" rx="22" ry="6" fill="#efe8d6" stroke="#b6a98c" stroke-width="2"/>
    <path d="M10 18 h24" stroke="#b6a98c" stroke-width="2"/>
  </g>

  <!-- chip wrapper -->
  <g transform="translate(664,856) rotate(-8)">
    <path d="M0 0 h96 l-12 22 h-72 Z" fill="#c9a06a" stroke="#9d7950" stroke-width="2"/>
    <path d="M-14 -6 l14 6 l-14 28 M110 -6 l-14 6 l14 28" fill="none" stroke="#9d7950" stroke-width="3" stroke-linejoin="round"/>
    <path d="M18 6 h56" stroke="#efe3cf" stroke-width="3" opacity=".7"/>
  </g>

  <!-- crumpled sheets -->
  <g transform="translate(248,708) rotate(-11)">
    <path d="M0 8 L46 0 L84 30 L30 46 Z" fill="#f2ecdc" stroke="#c3b79a" stroke-width="2"/>
    <path d="M16 16 L52 12 M22 28 L62 22" stroke="#cec2a6" stroke-width="2"/>
  </g>
  <g transform="translate(322,772) rotate(19)">
    <path d="M0 6 L40 0 L72 26 L26 40 Z" fill="#eae3d0" stroke="#bfb295" stroke-width="2"/>
  </g>

  <!-- plastic bag caught on the bush -->
  <g transform="translate(372,600) rotate(-8)" opacity=".92">
    <path d="M0 0 C-14 -26 -6 -52 14 -58 C34 -64 44 -44 36 -26 C28 -8 30 12 14 22 C-2 32 -14 18 0 0 Z"
          fill="#e6e8df" stroke="#bcc0af" stroke-width="2"/>
    <path d="M8 -52 C20 -48 28 -38 28 -26" fill="none" stroke="#bcc0af" stroke-width="2"/>
  </g>

  <!-- banana peel -->
  <g transform="translate(176,812) rotate(14)">
    <path d="M0 0 C-10 -22 -4 -44 8 -54 C22 -64 34 -58 34 -44 C22 -52 12 -42 10 -24 C8 -8 14 4 26 8 C12 14 -2 12 0 0 Z"
          fill="#d8c06a" stroke="#a88f42" stroke-width="2"/>
    <path d="M10 -24 C6 -34 12 -46 22 -50" fill="none" stroke="#a88f42" stroke-width="2"/>
  </g>

  <!-- cigarette ends -->
  <g transform="translate(700,872)">
    <rect x="0" y="0" width="26" height="7" rx="3" fill="#efe9da" stroke="#b9b19a" stroke-width="1.4"/>
    <rect x="0" y="0" width="9" height="7" rx="3" fill="#b98d5e"/>
    <rect x="42" y="12" width="24" height="7" rx="3" fill="#efe9da" stroke="#b9b19a" stroke-width="1.4"/>
    <rect x="42" y="12" width="8" height="7" rx="3" fill="#b98d5e"/>
  </g>

  <!-- dry leaves blown onto the path -->
  <g opacity=".75">
    <use href="#bTrash" transform="translate(560,744) rotate(24) scale(1.1)" stroke="#a98a52"/>
    <use href="#bTrash" transform="translate(392,676) rotate(-38) scale(.9)" stroke="#a98a52"/>
    <use href="#bTrash" transform="translate(300,862) rotate(62) scale(.8)" stroke="#a98a52"/>
  </g>

  <!-- untidy dull wash -->
  <rect width="1600" height="900" fill="#7c7658" opacity=".13"/>
</svg>

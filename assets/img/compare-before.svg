  <path d="M300 608 L300 432" stroke="#6b4a2f" stroke-width="16" stroke-linecap="round"/>
  <path d="M300 490 L266 452 M300 470 L336 434" stroke="#6b4a2f" stroke-width="9" stroke-linecap="round"/>
  <circle cx="292" cy="372" r="56" fill="#3f7d32"/>
  <circle cx="340" cy="340" r="46" fill="#2f6b2c"/>
  <circle cx="296" cy="314" r="44" fill="#5a9c45"/>

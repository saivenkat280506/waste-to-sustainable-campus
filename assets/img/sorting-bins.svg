<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="binsTitle binsDesc">
  <title id="binsTitle">Three labelled segregation bins</title>
  <desc id="binsDesc">Side by side bins for wet waste, paper and plastic, each in a different colour with a pictogram on the front.</desc>

  <defs>
    <linearGradient id="bWet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f8f45"/><stop offset="100%" stop-color="#256b2f"/>
    </linearGradient>
    <linearGradient id="bPap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f8fc4"/><stop offset="100%" stop-color="#246a9b"/>
    </linearGradient>
    <linearGradient id="bPla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a04a"/><stop offset="100%" stop-color="#c96a1e"/>
    </linearGradient>
    <linearGradient id="bFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f4"/><stop offset="100%" stop-color="#d9e2e6"/>
    </linearGradient>
  </defs>

  <!-- floor -->
  <path d="M0 352 Q180 330 360 352 Q540 374 720 344 L720 420 L0 420 Z" fill="url(#bFloor)"/>

  <!-- WET -->
  <g transform="translate(58,0)">
    <path d="M8 118 h96 l-9 234 h-78 Z" fill="url(#bWet)"/>
    <rect x="0" y="104" width="112" height="17" rx="6" fill="#1d5526"/>
    <rect x="24" y="86" width="64" height="13" rx="6" fill="#123f1b"/>
    <g transform="translate(26,150)" fill="none" stroke="#eaf6e4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 16 h40 v40 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 Z"/>
      <path d="M30 16 C30 6 37 1 45 0"/>
      <path d="M20 16 C20 9 25 4 32 2"/>
    </g>
    <rect x="14" y="252" width="84" height="30" rx="7" fill="#fbfaf4" opacity=".95"/>
    <text x="56" y="272" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#256b2f" text-anchor="middle" letter-spacing="1">WET</text>
  </g>

  <!-- PAPER -->
  <g transform="translate(266,0)">
    <path d="M8 118 h96 l-9 234 h-78 Z" fill="url(#bPap)"/>
    <rect x="0" y="104" width="112" height="17" rx="6" fill="#1d5a85"/>
    <rect x="24" y="86" width="64" height="13" rx="6" fill="#164466"/>
    <g transform="translate(25,150)" fill="none" stroke="#eaf5fb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 6 h34 v44 a5 5 0 0 1 -5 5 h-24 a5 5 0 0 1 -5 -5 Z"/>
      <path d="M8 6 h46"/>
      <path d="M23 22 h14 M23 34 h14 M23 46 h9"/>
    </g>
    <rect x="14" y="252" width="84" height="30" rx="7" fill="#fbfaf4" opacity=".95"/>
    <text x="56" y="272" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#246a9b" text-anchor="middle" letter-spacing="1">PAPER</text>
  </g>

  <!-- PLASTIC -->
  <g transform="translate(474,0)">
    <path d="M8 118 h96 l-9 234 h-78 Z" fill="url(#bPla)"/>
    <rect x="0" y="104" width="112" height="17" rx="6" fill="#a85414"/>
    <rect x="24" y="86" width="64" height="13" rx="6" fill="#7f3d0d"/>
    <g transform="translate(28,150)" fill="none" stroke="#fdf2e4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 4 h20 v12 l7 11 v22 a6 6 0 0 1 -6 6 h-22 a6 6 0 0 1 -6 -6 v-22 l7 -11 Z"/>
      <path d="M14 17 h28"/>
    </g>
    <rect x="14" y="252" width="84" height="30" rx="7" fill="#fbfaf4" opacity=".95"/>
    <text x="56" y="272" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#a85414" text-anchor="middle" letter-spacing="1">PLASTIC</text>
  </g>

  <!-- plant sprouting beside bins -->
  <g transform="translate(668,335)">
    <path d="M0 22 C0 -6 -10 -22 -26 -30" stroke="#3f7d32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0 22 C2 -10 12 -26 28 -32" stroke="#4f9440" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="-30" cy="-32" rx="12" ry="6.5" fill="#6aa84f" transform="rotate(-34 -30 -32)"/>
    <ellipse cx="32" cy="-34" rx="12" ry="6.5" fill="#4f9440" transform="rotate(28 32 -34)"/>
  </g>
</svg>

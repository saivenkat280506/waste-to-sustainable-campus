<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="binsTitle binsDesc">
  <title id="binsTitle">Three labelled segregation bins</title>
  <desc id="binsDesc">Side by side bins for wet waste, paper and plastic, each in a different colour with a pictogram on the front.</desc>

  <defs>
    <linearGradient id="bWet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b9732"/><stop offset="100%" stop-color="#2c6122"/>
    </linearGradient>
    <linearGradient id="bPap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6bb04f"/><stop offset="100%" stop-color="#3b802c"/>
    </linearGradient>
    <linearGradient id="bPla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a97a55"/><stop offset="100%" stop-color="#6f4626"/>
    </linearGradient>
    <linearGradient id="bFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5e6"/><stop offset="100%" stop-color="#dcebcf"/>
    </linearGradient>
  </defs>

  <!-- floor -->
  <path d="M0 352 Q180 330 360 352 Q540 374 720 344 L720 420 L0 420 Z" fill="url(#bFloor)"/>

  <!-- WET -->
  <g transform="translate(58,0)">
    <path d="M8 118 h96 l-9 234 h-78 Z" fill="url(#bWet)"/>
    <rect x="0" y="104" width="112" height="17" rx="6" fill="#16300f"/>
    <rect x="24" y="86" width="64" height="13" rx="6" fill="#0d210a"/>
    <g transform="translate(30,156)" fill="none" stroke="#e7f2dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 16 h40 v40 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 Z"/>
      <path d="M30 16 C30 6 37 1 45 0"/>
      <path d="M20 16 C20 9 25 4 32 2"/>
    </g>
    <rect x="16" y="252" width="80" height="30" rx="7" fill="#fbfaf4" opacity=".95"/>
    <text x="56" y="272" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#2c6122" text-anchor="middle" letter-spacing="1">WET</text>
  </g>

  <!-- PAPER -->
  <g transform="translate(266,0)">
    <path d="M8 118 h96 l-9 234 h-78 Z" fill="url(#bPap)"/>
    <rect x="0" y="104" width="112" height="17" rx="6" fill="#2c6122"/>
    <rect x="24" y="86" width="64" height="13" rx="6" fill="#16300f"/>
    <g transform="translate(30,150)" fill="none" stroke="#f2f8ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 6 h34 v44 a5 5 0 0 1 -5 5 h-24 a5 5 0 0 1 -5 -5 Z"/>
      <path d="M8 6 h46"/>
      <path d="M23 22 h14 M23 34 h14 M23 46 h9"/>
    </g>
    <rect x="10" y="252" width="92" height="30" rx="7" fill="#fbfaf4" opacity=".95"/>
    <text x="56" y="272" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#3b802c" text-anchor="middle" letter-spacing="1">PAPER</text>
  </g>

  <!-- PLASTIC -->
  <g transform="translate(474,0)">
    <path d="M8 118 h96 l-9 234 h-78 Z" fill="url(#bPla)"/>
    <rect x="0" y="104" width="112" height="17" rx="6" fill="#5c3a21"/>
    <rect x="24" y="86" width="64" height="13" rx="6" fill="#3e2513"/>
    <g transform="translate(28,150)" fill="none" stroke="#f1e3d3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 4 h20 v12 l7 11 v22 a6 6 0 0 1 -6 6 h-22 a6 6 0 0 1 -6 -6 v-22 l7 -11 Z"/>
      <path d="M14 17 h28"/>
    </g>
    <rect x="6" y="252" width="100" height="30" rx="7" fill="#fbfaf4" opacity=".95"/>
    <text x="56" y="272" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#6f4626" text-anchor="middle" letter-spacing="1">PLASTIC</text>
  </g>

  <!-- plant sprouting beside bins -->
  <g transform="translate(690,300)">
    <path d="M0 22 C0 -6 -10 -22 -26 -30" stroke="#3b802c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0 22 C2 -10 12 -26 28 -32" stroke="#4b9732" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="-30" cy="-32" rx="12" ry="6.5" fill="#6bb04f" transform="rotate(-34 -30 -32)"/>
    <ellipse cx="32" cy="-34" rx="12" ry="6.5" fill="#4b9732" transform="rotate(28 32 -34)"/>
  </g>
</svg>

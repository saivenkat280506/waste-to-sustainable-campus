<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 640" role="img" aria-labelledby="loopTitle loopDesc">
  <title id="loopTitle">The five-step campus circular loop</title>
  <desc id="loopDesc">A closed loop diagram connecting Reduce, Segregate, Recycle, Reuse and Educate around a green campus.</desc>

  <defs>
    <linearGradient id="coreG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7f2dc"/><stop offset="100%" stop-color="#c9e3b4"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8b5e3c"/>
    </marker>
  </defs>

  <!-- dashed orbit -->
  <circle cx="330" cy="320" r="232" fill="none" stroke="#c9e3b4" stroke-width="2.5" stroke-dasharray="10 14"/>

  <!-- five arcs -->
  <g fill="none" stroke="#8b5e3c" stroke-width="3" stroke-linecap="round" opacity=".85" marker-end="url(#arw)">
    <path d="M330 88 A232 232 0 0 1 531 204"/>
    <path d="M531 204 A232 232 0 0 1 531 436"/>
    <path d="M531 436 A232 232 0 0 1 330 552"/>
    <path d="M330 552 A232 232 0 0 1 129 436"/>
    <path d="M129 436 A232 232 0 0 1 129 204"/>
    <path d="M129 204 A232 232 0 0 1 330 88"/>
  </g>

  <!-- centre medallion -->
  <circle cx="330" cy="320" r="116" fill="url(#coreG)" stroke="#4b9732" stroke-width="3"/>
  <circle cx="330" cy="320" r="128" fill="none" stroke="#4b9732" stroke-width="1.6" stroke-dasharray="7 10" opacity=".65"/>
  <g transform="translate(330,320)">
    <path d="M-46 30 L-46 -18 L-14 -18 L-14 30 Z" fill="#fbfaf4" stroke="#2c6122" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-54 -18 L-30 -44 L-6 -18 Z" fill="#8b5e3c"/>
    <rect x="-24" y="-6" width="8" height="10" rx="2" fill="#2c6122"/>
    <rect x="-10" y="-6" width="8" height="10" rx="2" fill="#2c6122"/>
    <rect x="-24" y="10" width="22" height="8" rx="2" fill="#2c6122"/>
    <path d="M22 26 C22 -4 32 -20 48 -28" stroke="#3b802c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="52" cy="-32" rx="13" ry="7" fill="#6bb04f" transform="rotate(-30 52 -32)"/>
    <ellipse cx="24" cy="-12" rx="11" ry="6" fill="#4b9732" transform="rotate(24 24 -12)"/>
  </g>
  <text x="330" y="470" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#2c6122" text-anchor="middle">A SUSTAINABLE CAMPUS</text>

  <!-- node 1 : Reduce (top) -->
  <g transform="translate(330,88)">
    <circle r="62" fill="#2c6122"/>
    <circle r="62" fill="none" stroke="#16300f" stroke-width="2" opacity=".4"/>
    <g transform="translate(-22,-24)" fill="none" stroke="#e7f2dc" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 26 L4 8 L18 20 L4 32"/>
      <path d="M4 8 L4 -6"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#e7f2dc" text-anchor="middle" letter-spacing="1.6">REDUCE</text>
  </g>

  <!-- node 2 : Segregate (upper right) -->
  <g transform="translate(531,204)">
    <circle r="62" fill="#3b802c"/>
    <circle r="62" fill="none" stroke="#16300f" stroke-width="2" opacity=".4"/>
    <g transform="translate(-24,-26)" fill="none" stroke="#e7f2dc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 10 h14 l-1.5 22 h-11 Z"/><path d="M0 10 h18"/><path d="M9 10 V2"/>
      <path d="M24 10 h14 l-1.5 22 h-11 Z"/><path d="M22 10 h18"/><path d="M31 10 V2"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#e7f2dc" text-anchor="middle" letter-spacing="0.8">SEGREGATE</text>
  </g>

  <!-- node 3 : Recycle (lower right) -->
  <g transform="translate(531,436)">
    <circle r="62" fill="#4b9732"/>
    <circle r="62" fill="none" stroke="#16300f" stroke-width="2" opacity=".4"/>
    <g transform="translate(-20,-26)" fill="none" stroke="#f2f8ec" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 L22 20"/>
      <path d="M22 20 L6 20"/>
      <path d="M6 20 L-4 38"/>
      <path d="M-4 38 L2 20"/>
      <path d="M2 20 L14 2"/>
      <path d="M2 26 L10 41"/>
      <path d="M-4 38 L-16 38"/>
      <path d="M-4 38 L-10 25"/>
      <path d="M22 20 L30 36"/>
      <path d="M30 36 L14 36"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#f2f8ec" text-anchor="middle" letter-spacing="1.2">RECYCLE</text>
  </g>

  <!-- node 4 : Reuse (lower left) -->
  <g transform="translate(129,436)">
    <circle r="62" fill="#8b5e3c"/>
    <circle r="62" fill="none" stroke="#4a2d18" stroke-width="2" opacity=".35"/>
    <g transform="translate(-24,-28)" fill="none" stroke="#f7efe4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 10 h24 v22 h-24 Z"/><path d="M0 10 h28"/>
      <path d="M14 10 C14 2 18 -2 24 -4"/>
      <path d="M8 10 C8 4 11 1 15 0"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#f7efe4" text-anchor="middle" letter-spacing="1.6">REUSE</text>
  </g>

  <!-- node 5 : Educate (upper left) -->
  <g transform="translate(129,204)">
    <circle r="62" fill="#a97a55"/>
    <circle r="62" fill="none" stroke="#4a2d18" stroke-width="2" opacity=".35"/>
    <g transform="translate(-22,-26)" fill="none" stroke="#fbf6ef" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8 L22 1 L22 24 L2 24 Z"/>
      <path d="M22 8 L40 2 L40 26 L22 24"/>
      <path d="M6 34 h28"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#fbf6ef" text-anchor="middle" letter-spacing="1.2">EDUCATE</text>
  </g>
</svg>

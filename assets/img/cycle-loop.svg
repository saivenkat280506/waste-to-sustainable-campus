<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 640" role="img" aria-labelledby="loopTitle loopDesc">
  <title id="loopTitle">The five-step campus circular loop</title>
  <desc id="loopDesc">A closed loop diagram connecting Reduce, Segregate, Reuse, Recycle and Review around a green campus.</desc>

  <defs>
    <linearGradient id="coreG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4dc"/><stop offset="100%" stop-color="#cfe6bd"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7a5a3c"/>
    </marker>
  </defs>

  <!-- dashed orbit -->
  <circle cx="330" cy="320" r="232" fill="none" stroke="#c9d9c0" stroke-width="2.5" stroke-dasharray="10 14"/>

  <!-- five arcs -->
  <g fill="none" stroke="#7a5a3c" stroke-width="3" stroke-linecap="round" opacity=".85" marker-end="url(#arw)">
    <path d="M330 88 A232 232 0 0 1 531 204"/>
    <path d="M531 204 A232 232 0 0 1 531 436"/>
    <path d="M531 436 A232 232 0 0 1 330 552"/>
    <path d="M330 552 A232 232 0 0 1 129 436"/>
    <path d="M129 436 A232 232 0 0 1 129 204"/>
    <path d="M129 204 A232 232 0 0 1 330 88"/>
  </g>

  <!-- centre medallion -->
  <circle cx="330" cy="320" r="116" fill="url(#coreG)" stroke="#3f8f4e" stroke-width="3"/>
  <circle cx="330" cy="320" r="128" fill="none" stroke="#3f8f4e" stroke-width="1.6" stroke-dasharray="7 10" opacity=".65"/>
  <g transform="translate(330,320) scale(1.45)">
    <path d="M-46 30 L-46 -18 L-14 -18 L-14 30 Z" fill="#faf1df" stroke="#6b4a2f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-54 -18 L-30 -44 L-6 -18 Z" fill="#b4552f"/>
    <rect x="-40" y="-8" width="9" height="11" rx="2" fill="#8fbfd8"/>
    <rect x="-27" y="-8" width="9" height="11" rx="2" fill="#8fbfd8"/>
    <rect x="-36" y="14" width="12" height="16" rx="1.5" fill="#6b4a2f"/>
    <path d="M22 26 C22 -4 32 -20 48 -28" stroke="#3f7d32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="52" cy="-32" rx="13" ry="7" fill="#6aa84f" transform="rotate(-30 52 -32)"/>
    <ellipse cx="24" cy="-12" rx="11" ry="6" fill="#4f9440" transform="rotate(24 24 -12)"/>
  </g>

  <!-- node 1 : Reduce (top) -->
  <g transform="translate(330,88)">
    <circle r="62" fill="#2f6b2c"/>
    <circle r="62" fill="none" stroke="#1d4a1f" stroke-width="2" opacity=".4"/>
    <g transform="translate(-22,-24)" fill="none" stroke="#eaf6e4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 6 V28"/>
      <path d="M13 19 L22 28 L31 19"/>
      <path d="M9 36 H35"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#eaf6e4" text-anchor="middle" letter-spacing="1.6">REDUCE</text>
  </g>

  <!-- node 2 : Segregate (upper right) -->
  <g transform="translate(531,204)">
    <circle r="62" fill="#2f7f8f"/>
    <circle r="62" fill="none" stroke="#1d5560" stroke-width="2" opacity=".4"/>
    <g transform="translate(-20,-26)" fill="none" stroke="#e8f7fa" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 10 h14 l-1.5 22 h-11 Z"/><path d="M0 10 h18"/><path d="M9 10 V2"/>
      <path d="M24 10 h14 l-1.5 22 h-11 Z"/><path d="M22 10 h18"/><path d="M31 10 V2"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#e8f7fa" text-anchor="middle" letter-spacing="0.8">SEGREGATE</text>
  </g>

  <!-- node 3 : Reuse (lower right) -->
  <g transform="translate(531,436)">
    <circle r="62" fill="#d9822b"/>
    <circle r="62" fill="none" stroke="#a85414" stroke-width="2" opacity=".4"/>
    <g transform="translate(-22,-26)" fill="none" stroke="#fdf2e4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 20 H34 L31 38 H13 Z"/>
      <path d="M8 20 H36"/>
      <path d="M22 20 V10"/>
      <path d="M22 12 C22 6 17 3 10 3 C10 9 15 12 22 12 Z"/>
      <path d="M22 15 C22 10 27 7 33 8 C32 13 28 16 22 15 Z"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#fdf2e4" text-anchor="middle" letter-spacing="1.6">REUSE</text>
  </g>

  <!-- node 4 : Recycle (lower left) -->
  <g transform="translate(129,436)">
    <circle r="62" fill="#3f8f4e"/>
    <circle r="62" fill="none" stroke="#1d5526" stroke-width="2" opacity=".35"/>
    <g transform="translate(-22,-26)" fill="none" stroke="#eaf6e4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 22 A14 14 0 0 1 30 13"/>
      <path d="M24 4 L32 12 L22 15 Z" fill="#eaf6e4" stroke="none"/>
      <path d="M36 22 A14 14 0 0 1 14 31"/>
      <path d="M20 40 L12 32 L22 29 Z" fill="#eaf6e4" stroke="none"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#eaf6e4" text-anchor="middle" letter-spacing="1.2">RECYCLE</text>
  </g>

  <!-- node 5 : Review (upper left) -->
  <g transform="translate(129,204)">
    <circle r="62" fill="#7a5a3c"/>
    <circle r="62" fill="none" stroke="#4f3824" stroke-width="2" opacity=".35"/>
    <g transform="translate(-16,-26)" fill="none" stroke="#f7efe4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6 h24 v28 h-24 Z"/>
      <path d="M11 1 h10 v7 h-10 Z"/>
      <path d="m10 18 3 3 6 -6"/>
      <path d="M10 29 h12"/>
    </g>
    <text y="36" font-family="Karla, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#f7efe4" text-anchor="middle" letter-spacing="1.2">REVIEW</text>
  </g>
</svg>

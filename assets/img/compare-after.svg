<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cmpAfterTitle cmpAfterDesc">
  <title id="cmpAfterTitle">The same campus with the waste plan in place</title>
  <desc id="cmpAfterDesc">A flat illustration of the same campus walkway, clean and swept, with three labelled segregation bins for wet waste, paper and plastic, a plant pot made from a reused container, a garden bed of seedlings and a clear signpost.</desc>

  <defs>

      <path d="M11 4 V30" stroke="#f4faee" stroke-width="1.6" opacity=".32"/>
    </g>
    <g id="aLeaf">
      <path d="M0 0 C10 -13 27 -13 34 0 C27 13 10 13 0 0 Z M0 0 C10 -5 24 -5 34 0" fill="none" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

